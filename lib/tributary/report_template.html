<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f4f5f7;--fg:#1c2230;--muted:#6b7385;--line:#dde1e8;--card:#ffffff;--card2:#f8f9fb;
  --accent:#1f5fbf;--accent-soft:#e3ecfa;--warn:#b25b00;--warn-soft:#fff1e0;--bad:#b3261e;--bad-soft:#fde8e6;--ok:#1e7a3c;--ok-soft:#e3f4e8;
  --plan:#ffffff;--wall:#3a4252;--col:#1c2230;--beam:#8a94a8;--slabline:#1c2230;
  --mid:#eceef2;--beamz:#dde3ee;--border:rgba(255,255,255,.9);--sel:#1f5fbf;--meas:#c2185b;--off:#c2185b;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b;--fg:#e6e9ef;--muted:#98a0b3;--line:#2a303c;--card:#1a1e26;--card2:#20252f;
  --accent:#6ea2ff;--accent-soft:#1f2b44;--warn:#f0a44b;--warn-soft:#3a2a15;--bad:#ff7a70;--bad-soft:#3a1c1a;--ok:#5cc98a;--ok-soft:#173022;
  --plan:#161a21;--wall:#c9cfdb;--col:#e6e9ef;--beam:#7b86a0;--slabline:#c9cfdb;
  --mid:#2a2f3a;--beamz:#2c3444;--border:rgba(0,0,0,.55);--sel:#6ea2ff;--meas:#ff6fa8;--off:#ff6fa8;
  --shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 "Segoe UI",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0;font-weight:600}
header .sub{color:var(--muted);font-size:12px}
header .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 10px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
main.work{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;padding:12px 16px;height:calc(100vh - 120px);min-height:520px}
.stage{position:relative;background:var(--plan);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);min-height:0}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default;user-select:none}
#plan.panning{cursor:grabbing}
#plan.measure{cursor:crosshair}
#plan.tool-sup{cursor:pointer}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:var(--shadow);flex-wrap:wrap;max-width:calc(100% - 20px)}
.tools button{border:0;background:transparent;border-radius:5px;padding:5px 9px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tools button:hover{background:var(--card2)}
.tools button.on{background:var(--accent-soft);color:var(--accent)}
.tools .sep{width:1px;background:var(--line);margin:3px 2px}
.tools svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.status{position:absolute;left:10px;bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.busy{position:absolute;right:10px;top:10px;background:var(--accent);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;display:none}
.hintbar{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:var(--card);border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:3px 10px;font-size:12px;display:none;white-space:nowrap}
.legend{position:absolute;right:10px;bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;max-width:320px}
.legend .row{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend .sw{width:14px;height:10px;border-radius:2px;border:1px solid var(--line)}
.legend .ramp{height:8px;border-radius:4px;margin:4px 0 2px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;box-shadow:var(--shadow);display:none;white-space:nowrap;z-index:5}
aside.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--shadow)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:9px 2px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab{padding:12px 14px;overflow:auto;flex:1;min-height:0}
.hint{color:var(--muted)}
.card{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 10px}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
details.sec{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
details.sec>summary{cursor:pointer;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'▸';transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(90deg)}
details.sec>div{padding:0 10px 10px}
.phead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.phead .num{min-width:38px;height:38px;border-radius:19px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#1c2230}
.phead .k{font-weight:600;font-size:15px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi .l{color:var(--muted);font-size:11px}
.kpi .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:400;color:var(--muted)}
.kpi.main{border-color:var(--accent);background:var(--accent-soft)}
.formula{font-family:Consolas,monospace;font-size:12px;background:var(--card2);border:1px dashed var(--line);border-radius:6px;padding:6px 8px;margin-bottom:10px;overflow-wrap:anywhere}
.frm{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.frm input[type=number],.frm select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--card);font-variant-numeric:tabular-nums}
input.inp{background:#fff7d6 !important;border-color:#e8cf7a !important}
@media (prefers-color-scheme:dark){input.inp{background:#3a3320 !important;border-color:#6b5a2a !important}}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:12px;padding:2px 9px;background:var(--card);cursor:pointer;font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.verdict{display:flex;gap:8px;align-items:center;border:1px solid;border-radius:8px;padding:8px 10px;margin:0 0 10px;font-weight:600}
.verdict .eta{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict.ok,.res.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.verdict.reinf,.res.reinf{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.verdict.thick,.res.thick{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.res{display:inline-block;border-radius:10px;padding:0 7px;font-size:11px;font-weight:600}
.frm4{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center}
.frm4 input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--card);font-variant-numeric:tabular-nums}
.flag{display:inline-block;border-radius:10px;padding:1px 8px;background:var(--warn-soft);color:var(--warn);font-size:11px;margin:0 4px 4px 0}
table.kv{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.kv td,table.kv th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right}
table.kv th{color:var(--muted);font-weight:500}
table.kv td:first-child,table.kv th:first-child{text-align:left}
table.kv input{width:54px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--card);text-align:right}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0}
.bar span{display:block}
.mini{font-size:11px;color:var(--muted)}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.offrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
details.tbl{margin:0 16px 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
details.tbl>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
details.tbl>summary::-webkit-details-marker{display:none}
details.tbl>summary::before{content:'▸ ';color:var(--muted)}
details.tbl[open]>summary::before{content:'▾ '}
.tblbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tblbar input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);min-width:220px}
.tblwrap{overflow:auto;max-height:60vh}
#tbl{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
#tbl th{position:sticky;top:0;background:var(--card);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
#tbl th.l,#tbl td.l{text-align:left}
#tbl td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#tbl tr:hover td{background:var(--card2)}
#tbl tr.sel td{background:var(--accent-soft)}
#tbl td.fl{white-space:normal;min-width:160px;color:var(--warn)}
#tbl .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* svg */
.z{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.z.dim{opacity:.35}
.z.hl{stroke:var(--sel);stroke-width:3}
.z.hov{filter:brightness(.93)}
.noborders .z{stroke:none}
.noborders .z.hl{stroke:var(--sel)}
.tool-sup .z{cursor:default;opacity:.75}
.slabhl{fill:var(--sel);fill-opacity:.1;stroke:var(--sel);stroke-width:3.5;vector-effect:non-scaling-stroke;pointer-events:none}
tr.slabrow{cursor:pointer}
tr.slabrow:hover td{background:var(--card2)}
tr.slabrow.on td{background:var(--accent-soft)}
.slab{fill:none;stroke:var(--slabline);stroke-width:1.4;vector-effect:non-scaling-stroke;pointer-events:none}
.holef{fill:url(#holeHatch);stroke:var(--slabline);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.sup{pointer-events:none}
.tool-sup .sup{pointer-events:all;cursor:pointer}
.wall{fill:var(--wall)}
.colr{fill:var(--col)}
.beamu{fill:var(--beam);opacity:.9}
.beamx{fill:none;stroke:var(--beam);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.tool-sup .beamx{fill:rgba(138,148,168,.15)}
.sup.off{fill:url(#offHatch);stroke:var(--off);stroke-width:1.2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;opacity:1}
.sup.forced{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.sup.shov{stroke:var(--meas);stroke-width:3;vector-effect:non-scaling-stroke}
.sup.added{stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.sup.edited{stroke:var(--warn);stroke-width:1.6;stroke-dasharray:6 3;vector-effect:non-scaling-stroke}
.sup.esel{stroke:var(--sel);stroke-width:3;stroke-dasharray:none;vector-effect:non-scaling-stroke}
#plan.tool-edit,#plan.tool-add{cursor:crosshair}
.tool-edit .sup{pointer-events:all;cursor:pointer}
.tool-edit .z,.tool-add .z{cursor:crosshair;opacity:.75}
.tool-edit .bub,.tool-add .bub{pointer-events:none;opacity:.5}
.hnd circle{fill:var(--card);stroke:var(--sel);stroke-width:2;cursor:grab}
.hnd.c circle{fill:var(--sel)}
.bub{cursor:pointer}
.bub circle{stroke:#fff;stroke-width:1.5}
.bub text{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#1c2230;pointer-events:none}
.bub .lb{font-size:11px;font-weight:600;text-anchor:start;fill:var(--fg);paint-order:stroke;stroke:var(--plan);stroke-width:3px;stroke-linejoin:round}
.bub.hl circle{stroke:var(--sel);stroke-width:3}
.bub.dim{opacity:.4}
.tool-sup .bub{pointer-events:none;opacity:.5}
.meas line,.meas polyline,.meas polygon{stroke:var(--meas);stroke-width:1.8;vector-effect:non-scaling-stroke;fill:none}
.meas polygon{fill:var(--meas);fill-opacity:.1}
.meas circle{fill:var(--meas)}
.mlbl text{font-size:12px;font-weight:600;fill:var(--meas);paint-order:stroke;stroke:var(--plan);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
.snap{fill:none;stroke:var(--meas);stroke-width:1.6}
.pop{position:absolute;left:10px;top:52px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 4px 16px rgba(16,24,40,.18);width:270px;max-height:calc(100% - 64px);overflow:auto}
.pop h3{margin:8px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.pop h3:first-child{margin-top:0}
.pop label{display:block;margin:2px 0}
.pop select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--card)}
.steps{margin:0 0 10px;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:8px;align-items:flex-start;margin:0 0 6px}
.steps li::before{content:counter(st);flex:none;width:20px;height:20px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;display:grid;place-items:center}
.steps li.done::before{content:'✓';background:var(--ok-soft);color:var(--ok)}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.back{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 8px;font-size:12px}
.back:hover{color:var(--accent)}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pchip{border:1px solid;border-radius:10px;padding:0 7px;font-size:11px;font-weight:600;cursor:pointer;background:transparent}
.pchip.reinf{color:var(--warn);border-color:var(--warn)}
.pchip.thick{color:var(--bad);border-color:var(--bad)}
.hbox{display:grid;grid-template-columns:auto 90px 1fr;gap:6px 8px;align-items:center}
.hbox input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--card);font-variant-numeric:tabular-nums;text-align:right}
.hbox .mini{line-height:1.3}
.ch{color:var(--accent);font-weight:600}
table.kv input.hin{width:58px}
table.kv input.hin.ch{border-color:var(--accent);color:var(--accent);font-weight:600}
@media (max-width:1000px){main.work{grid-template-columns:1fr;height:auto}.stage{height:65vh}aside.panel{height:62vh}}
</style>
</head>
<body>
<header class="top">
  <div><h1 id="h1"></h1><div class="sub" id="sub"></div></div>
  <div class="grow"></div>
  <div class="seg" id="units" title="Units of forces and loads (1 t = 10 kN)"><button data-u="t">t</button><button data-u="kN">kN</button></div>
  <button class="btn" id="btnRevit" title="Supports, added / edited walls, columns, beams and slab thickness back as in the Revit model. Loads and factors are kept">Reset to Revit</button>
  <button class="btn" id="btnCsv" title="Point table with the current loads and supports">Export CSV</button>
</header>
<main class="work">
  <section class="stage" id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="tools" id="tools">
      <button data-tool="select" title="Select: click a point/zone, Ctrl for several, drag to pan (V)">
        <svg viewBox="0 0 16 16"><path d="M3 2l9 5-4 1-2 4z"/></svg>Select</button>
      <span class="sep"></span>
      <button data-tool="sup" title="Supports: click a wall, column or beam to switch it on/off as a support. The plan is recomputed (O)">
        <svg viewBox="0 0 16 16"><path d="M2 13h12M4 13V5h3v8M9 13V8h3v5"/></svg>Supports</button>
      <button data-tool="edit" title="Edit: click a wall, beam or column; drag an end to shorten / extend it (Shift = free), drag a column centre to move it. Delete removes (E)">
        <svg viewBox="0 0 16 16"><path d="M2 14l1-4 8-8 3 3-8 8z M9 4l3 3"/></svg>Edit</button>
      <button data-tool="addw" title="Add a wall or a line support: click the start, click the end. Shift = orthogonal (W)">
        <svg viewBox="0 0 16 16"><path d="M2 11h9v3H2z M13 2v6M10 5h6"/></svg>Wall</button>
      <button data-tool="addc" title="Add a column: click its centre (C)">
        <svg viewBox="0 0 16 16"><path d="M2 8h6v6H2z M13 2v6M10 5h6"/></svg>Column</button>
      <span class="sep"></span>
      <button data-tool="len" title="Length: click, click. Shift = orthogonal. Esc = cancel (M)">
        <svg viewBox="0 0 16 16"><path d="M2 12L12 2l2 2L4 14z M5 9l1 1 M7 7l1 1 M9 5l1 1"/></svg>Length</button>
      <button data-tool="area" title="Area: click the vertices, double-click or Enter to close (A)">
        <svg viewBox="0 0 16 16"><path d="M2 4l6-2 6 4-2 8-9-2z"/></svg>Area</button>
      <button id="clearMeas" title="Delete all measurements (Delete = last one)"><svg viewBox="0 0 16 16"><path d="M3 4h10M6 4V2h4v2M4 4l1 10h6l1-10"/></svg></button>
      <span class="sep"></span>
      <button id="fit" title="Fit (F)"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>Fit</button>
      <button id="btnView" title="Colouring, labels, layers"><svg viewBox="0 0 16 16"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>View</button>
    </div>
    <div class="pop" id="viewPop" hidden></div>
    <div class="busy" id="busy">Recomputing…</div>
    <div class="hintbar" id="hintbar">Supports mode: click a wall, column or beam to switch it off/on. Esc to exit</div>
    <div class="legend" id="legend"></div>
    <div class="status" id="status">—</div>
    <div class="tip" id="tip"></div>
  </section>
  <aside class="panel">
    <nav class="tabs" id="tabs">
      <button data-tab="sel" class="on">Results</button><button data-tab="loads">Slabs &amp; loads</button><button data-tab="sup">Supports</button></nav>
    <div class="tab" id="tab-sel"></div>
    <div class="tab" id="tab-loads" hidden></div>
    <div class="tab" id="tab-sup" hidden></div>
  </aside>
</main>
<details class="tbl" id="tblbox">
  <summary id="tblsum">Punching points table</summary>
  <div class="tblbar"><div class="chips" id="chips"></div>
    <input id="q" type="search" placeholder="Search: #, ElementId, flag"><span class="mini" id="tblcount"></span></div>
  <div class="tblwrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
</details>
<script>/*__ENGINE__*/</script>

  html += sec('about', 'How it is computed', '<p class="mini" style="margin:0">Zone boundary = perpendicular bisector between neighbouring supports (tributary guide, rule 4); ' +

// ------------------------------------------------------------ таблица

var FILTERS = [['all', 'All'], ['column', 'Columns'], ['pylon', 'Piers'], ['wall_L', 'L corners'], ['wall_end', 'Wall ends'], ['flags', 'Flagged'],
  ['thick', 'Thicken'], ['reinf', 'Reinforce']];
function renderTable() {

    else if (S.filter === 'thick' || S.filter === 'reinf') { if (rc !== S.filter) return false; }
    else if (S.filter !== 'all' && p.kind !== S.filter) return false;
    return !q || String(p.n) === q || p.ids.join(' ').indexOf(q) >= 0 || p.flags.join(' ').toLowerCase().indexOf(q) >= 0 || (KL[p.kind] || '').toLowerCase().indexOf(q) >= 0;
  });
  var col = COLS.filter(function (c) { return c.k === S.sort.k; })[0] || COLS[0];
  list.sort(function (a, b) { var x = col.v(a.p, a.c), y = col.v(b.p, b.c); if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * S.sort.d; });
  $('#tbl thead').innerHTML = '<tr>' + COLS.map(function (c) {
    return '<th data-k="' + c.k + '"' + (c.l ? ' class="l"' : '') + '>' + esc(c.t) + (c.u ? ', ' + uF() : '') + (S.sort.k === c.k ? (S.sort.d > 0 ? ' ▲' : ' ▼') : '') + '</th>'; }).join('') + '</tr>';
  $('#tbl tbody').innerHTML = list.map(function (r) {
    return '<tr data-n="' + r.p.n + '"' + (S.sel.indexOf(r.p.sk) >= 0 ? ' class="sel"' : '') + '>' + COLS.map(function (c, i) {
      var v = c.v(r.p, r.c), s = c.h ? c.h(r.p, r.c) : c.f != null ? fmt(v, c.f) : esc(v == null ? '—' : v);

  }).join('');

}
$('#tblbox').open = !!S.tblOpen;
$('#tblbox').addEventListener('toggle', function () { S.tblOpen = $('#tblbox').open; save(); renderTable(); });
$('#tbl thead').addEventListener('click', function (e) { var th = e.target.closest('th'); if (!th) return; var k = th.dataset.k; S.sort = {k: k, d: S.sort.k === k ? -S.sort.d : 1}; renderTable(); });
$('#tbl tbody').addEventListener('click', function (e) {
  var tr = e.target.closest('tr'); if (!tr) return;

  if (e.ctrlKey || e.metaKey || e.shiftKey) { var i = S.sel.indexOf(p.sk); if (i >= 0) S.sel.splice(i, 1); else S.sel.push(p.sk); } else S.sel = [p.sk];
  refreshSel(); showTab('sel'); centerOn(p);
});
function centerOn(p) {

$('#chips').innerHTML = FILTERS.map(function (f) { return '<span class="chip' + (S.filter === f[0] ? ' on' : '') + '" data-f="' + f[0] + '">' + f[1] + '</span>'; }).join('');
$('#chips').addEventListener('click', function (e) {

// ------------------------------------------------------------ экспорт
function chkCsv(p, c, n2, qq) {
  var ch = c.chk, inp = rfOf(p);
  if (!ch) return ['', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', ''];
  return [n2(ch.u0, 3), n2(ch.u1, 3), n2(ch.Au1, 3), n2(ch.K, 3), n2(ch.rho, 5), n2(outF(ch.VRdc), 1), n2(outF(ch.VRdmax), 1), n2(outF(ch.Veq), 1), n2(ch.eta, 2),
    qq(ch.label), n2(ch.Asw, 2), ch.m == null ? '' : ch.m, ch.sr == null ? '' : Math.round(ch.sr * 1000), n2(ch.Asa, 2), n2(ch.Asb, 2), qq(ch.warn.join('; ')),
    inp.fck, qq('D' + inp.top_d1 + '@' + inp.top_s1 + (inp.top_d2 > 0 ? ' + D' + inp.top_d2 + '@' + inp.top_s2 : ''))];
}
$('#btnCsv').addEventListener('click', function () {
  var n2 = function (v, d) { return v == null || !isFinite(v) ? '' : v.toFixed(d); };
  var qq = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
  var lines = [['#', 'Type', 'Position', 'A, m²', 'SW+DL, ' + uF(), 'LL, ' + uF(), 'k', 'dV, ' + uF(), 'V_d, ' + uF(), 'beta', 'beta*V_d, ' + uF(), 'h, mm', 'd_m, mm', 'c1/la, mm', 'c2/lb, mm',
    't_a, mm', 't_b, mm', 'q_d, ' + uQ(), 'u0, m', 'u1, m', 'A_u1, m²', 'K', 'rho', 'V_Rd,c, ' + uF(), 'V_Rd,max, ' + uF(), 'V_eq, ' + uF(), 'eta', 'Check',
    'A_sw, cm²/perimeter', 'Perimeters', 's_r, mm', 'A_s,bent, cm²', 'A_sb, cm²', 'Check notes', 'fck', 'Top bars',
    'Calculator', 'X, m', 'Y, m', 'ElementId', 'Link', 'Flags'].map(function (x) { return qq(x); }).join(',')];
  R.points.forEach(function (p) {
    var c = calc(p);
    lines.push([p.n, qq(KL[p.kind]), qq(p.cls ? CL[p.cls] : ''), n2(c.A, 2), n2(outF(c.G), 1), n2(outF(c.Q), 1), n2(c.k, 2), n2(outF(c.dv), 1), n2(outF(c.Vd), 1), n2(c.beta, 2),
      n2(c.bVd != null ? outF(c.bVd) : null, 1), p.h, p.dm, p.c1 == null ? '' : p.c1, p.c2 == null ? '' : p.c2, p.ta == null ? '' : p.ta, p.tb == null ? '' : p.tb,
      n2(outF(c.qd), 2)].concat(chkCsv(p, c, n2, qq)).concat([qq(p.calc), n2(p.x / 1000, 3), n2(p.y / 1000, 3), qq(p.ids.join(', ')), qq(p.links.join(', ')), qq(p.flags.join('; '))]).join(','));
  });
  if (S.off.length || S.beamOn.length) lines.push('', qq('Supports changed in the plan: switched off ' + S.off.join(', ') + (S.beamOn.length ? '; beams switched on: ' + S.beamOn.join(', ') : '')));
  var mm = function (q) { return '(' + (q[0] / 1000).toFixed(3) + ';' + (q[1] / 1000).toFixed(3) + ')'; };
  S.edit.add.forEach(function (a) {
    lines.push(qq('Added in the plan: ' + TYPE_NAME[a.type] + ' ' + a.id + (a.type === 'c' ? ' ' + a.b + 'x' + a.h + ' at ' + mm([a.x, a.y])
      : ' ' + (a.type === 'w' ? 't' : 'b') + ' ' + (a.t || a.b) + ' from ' + mm(a.p0) + ' to ' + mm(a.p1)) + ' m'));
  });
  Object.keys(S.hOv).forEach(function (fid) { lines.push(qq('Slab thickness changed in the plan: slab ' + fid + ' h ' + S.hOv[fid] + ' mm (model ' + Math.round(FL[fid].h) + ')')); });
  Object.keys(S.edit.geo).forEach(function (k) { lines.push(qq('Geometry changed in the plan: ' + k + ' ' + JSON.stringify(S.edit.geo[k]))); });
  var blob = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}), a = h('a');
  a.href = URL.createObjectURL(blob);
  a.download = ('tributary_' + D.meta.doc + '_' + D.meta.level + '.csv').replace(/[^\w.\-]+/g, '_');
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
});

// ------------------------------------------------------------ инструменты и клавиши
var HINTS = {sup: 'Supports mode: click a wall, column or beam to switch it off/on. Esc to exit',
  edit: 'Edit: click a support, drag an end to shorten / extend (Shift = free), Delete removes. Esc to exit',
  addw: 'Add wall: click the start, click the end (snaps to walls and slab corners, Shift = orthogonal). Esc to exit',
  addc: 'Add column: click its centre (snaps to walls and slab corners). Esc to exit'};
var SUP_TOOLS = {sup: 1, edit: 1, addw: 1, addc: 1};
function setTool(t) {
  if (t !== 'edit') S.esel = null;
  S.tool = t; S.draft = null; cursor = null; showSnap(null); setSupHov(null); tip.style.display = 'none';
  document.querySelectorAll('#tools [data-tool]').forEach(function (b) { b.classList.toggle('on', b.dataset.tool === t); });
  svg.classList.toggle('measure', t === 'len' || t === 'area');
  svg.classList.toggle('tool-sup', t === 'sup');
  svg.classList.toggle('tool-edit', t === 'edit');
  svg.classList.toggle('tool-add', t === 'addw' || t === 'addc');
  $('#hintbar').textContent = HINTS[t] || ''; $('#hintbar').style.display = HINTS[t] ? 'block' : 'none';
  $('#legend').style.display = SUP_TOOLS[t] ? 'none' : '';
  if (SUP.length) { restyleSupports(); renderHandles(); }
  renderMeas();
}
$('#tools').addEventListener('click', function (e) { var b = e.target.closest('[data-tool]'); if (b) { setTool(b.dataset.tool); if (SUP_TOOLS[b.dataset.tool]) showTab('sup'); renderSup(); } });
$('#fit').addEventListener('click', fit);
$('#clearMeas').addEventListener('click', function () { S.meas = []; S.draft = null; renderMeas(); });
document.addEventListener('keydown', function (e) {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var k = e.key.toLowerCase();
  if (k === 'escape') {
    if (S.draft) { S.draft = null; tip.style.display = 'none'; renderMeas(); }
    else if (S.tool === 'edit' && S.esel) { S.esel = null; restyleSupports(); renderHandles(); renderSup(); }
    else if (S.tool !== 'select') { setTool('select'); renderSup(); } else { S.sel = []; refreshSel(); }
  }
  else if (k === 'enter' && S.tool === 'area') finishArea();
  else if (k === 'backspace' && S.draft) { S.draft.pts.pop(); if (!S.draft.pts.length) S.draft = null; renderMeas(); e.preventDefault(); }
  else if (k === 'delete' && S.tool === 'edit') { var ds = S.esel ? supByKey(S.esel) : null; if (ds) deleteSup(ds); }
  else if (k === 'delete') { S.meas.pop(); renderMeas(); }
  else if (k === 'e' || k === 'у') { setTool('edit'); showTab('sup'); renderSup(); }
  else if (k === 'w' || k === 'ц') { setTool('addw'); showTab('sup'); renderSup(); }
  else if (k === 'c' || k === 'с') { setTool('addc'); showTab('sup'); renderSup(); }
  else if (k === 'f' || k === 'а') fit();
  else if (k === 'v' || k === 'м') { setTool('select'); renderSup(); }
  else if (k === 'o' || k === 'щ') { setTool('sup'); showTab('sup'); renderSup(); }
  else if (k === 'm' || k === 'ь') setTool('len');
  else if (k === 'a' || k === 'ф') setTool('area');
  else if (k === '+' || k === '=') zoomBy(0.8); else if (k === '-') zoomBy(1.25);
});
document.querySelectorAll('#units button').forEach(function (b) { b.addEventListener('click', function () { S.unit = b.dataset.u; save(); unitsUi(); update(); renderLoads(); }); });
function nRevit() { return S.off.length + S.beamOn.length + nEdits() + nH(); }
$('#btnRevit').addEventListener('click', function () {
  var n = nRevit();
  if (!n || !confirm('Reset the plan to the Revit model?\n\nRemoved: switched-off / switched-on supports, added and edited walls, columns, beams, ' +
    'changed slab thickness (' + n + ' changes).\nKept: loads, γ, β, k, ΔV, concrete and bars.')) return;
  var keep = S.edit; S.edit = newEdit(); S.edit.seq = keep.seq; S.edit.nw = keep.nw; S.edit.nc = keep.nc;
  S.off = []; S.beamOn = []; S.hOv = {}; S.esel = null;
  save(); renderLoads(); recompute();
});
function unitsUi() { document.querySelectorAll('#units button').forEach(function (b) { b.classList.toggle('on', b.dataset.u === S.unit); }); }
function update() { paint(); renderSel(); renderTable(); }

// ------------------------------------------------------------ старт
$('#h1').textContent = D.title; document.title = D.title;
unitsUi(); setTool('select'); fit(); compute(); renderLoads(); renderSup(); fit();
})();
